<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Gemini Notebook 연결 요청 구분</title><desc id="desc">대화에서 자료를 조회하는 요청과 변경하는 요청을 구분하는 교육용 도식</desc><rect width="1600" height="900" fill="#101b30"/><g font-family="sans-serif" fill="#fff"><text x="90" y="120" font-size="32" fill="#80d8d0">AI 뉴스 · 공식 발표 읽기</text><text x="90" y="210" font-size="58" font-weight="bold">대화에서 노트북으로</text><text x="90" y="275" font-size="30">Gemini 앱 ↔ Gemini Notebook 연결</text><rect x="90" y="350" width="680" height="280" rx="26" fill="#174658"/><rect x="830" y="350" width="680" height="280" rx="26" fill="#493a68"/><text x="130" y="420" font-size="40" font-weight="bold">조회 요청</text><text x="130" y="495" font-size="32">출처 목록 보여주기</text><text x="130" y="550" font-size="32">자료 내용에 질문하기</text><text x="870" y="420" font-size="40" font-weight="bold">변경 요청</text><text x="870" y="495" font-size="32">노트북·출처 생성과 수정</text><text x="870" y="550" font-size="32">삭제 요청은 대상부터 확인</text><text x="90" y="720" font-size="30" fill="#c5d5e8">사용 전: 연결 설정 · 조직 허용 여부 · 변경 범위 확인</text><text x="90" y="825" font-size="26" fill="#aebed3">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>