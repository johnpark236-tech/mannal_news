<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Decisions API의 정해진 답 범위 안 판단</title><desc id="d">개발자가 질문과 허용 답을 정하고 맥락을 넣어 확률, 선택, 점수 결과를 받는 구조. 사람 검토 조건은 별도로 설계한다.</desc><rect width="1200" height="675" fill="#15273b"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="64" y="61" fill="#90ded0" font-size="22">MANNAL DAILY / AI WORKFLOWS</text><text x="64" y="125" fill="#fff" font-size="41" font-weight="700">Decisions API, 작은 판단을 구조화하다</text><text x="64" y="174" fill="#cfdeef" font-size="25">2026.10.22 정식 제공 발표 · 개발자용 API</text><rect x="64" y="231" width="328" height="185" rx="20" fill="#2c425f"/><text x="90" y="276" fill="#90ded0" font-size="24">01 기준 정의</text><text x="90" y="330" fill="#fff" font-size="30" font-weight="700">질문 + 허용 답</text><text x="90" y="375" fill="#cfdeef" font-size="23">무엇을 고를지 정하기</text><rect x="436" y="231" width="328" height="185" rx="20" fill="#25514d"/><text x="462" y="276" fill="#a3ebce" font-size="24">02 맥락 입력</text><text x="462" y="330" fill="#fff" font-size="30" font-weight="700">텍스트·이미지</text><text x="462" y="375" fill="#cfdeef" font-size="23">JSON 등 필요한 자료</text><rect x="808" y="231" width="328" height="185" rx="20" fill="#483c59"/><text x="834" y="276" fill="#e5c7f4" font-size="24">03 결과 활용</text><text x="834" y="330" fill="#fff" font-size="29" font-weight="700">확률·선택·점수</text><text x="834" y="375" fill="#cfdeef" font-size="23">앱의 다음 단계에 사용</text><rect x="64" y="455" width="1072" height="109" rx="18" fill="#30415a"/><text x="90" y="498" fill="#ffdda1" font-size="25" font-weight="700">기자의 수업 제안: 문의 분류 기준과 사람 확인 조건 만들기</text><text x="90" y="539" fill="#cfdeef" font-size="22">종이로도 실습 가능 / API 호출·키 발급·추가 결제 없이 진행</text><text x="64" y="609" fill="#bdcde1" font-size="21">출처 OpenAI 공식 공지 · 사용 가능 조건과 비용은 별도 확인</text><text x="64" y="645" fill="#bdcde1" font-size="20">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>