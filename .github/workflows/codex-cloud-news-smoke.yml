name: Verify cloud Codex hourly news schedule

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-cloud-hourly-news.yml"
      - ".github/workflows/codex-cloud-news-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate YAML and no cached secrets
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import pathlib, yaml
          p=pathlib.Path(".github/workflows/codex-cloud-hourly-news.yml")
          s=p.read_text(encoding="utf-8")
          obj=yaml.safe_load(s)
          on=obj.get("on") or obj.get(True)
          assert on["schedule"][0]["cron"]=="5 * * * *"
          assert "workflow_dispatch" in on
          assert obj["permissions"]["actions"]=="write"
          assert "CODEX_AUTH_JSON" in s and "secrets.CODEX_AUTH_JSON" in s
          assert "actions/cache" not in s and "auth.json" not in s.split("Save")[0] if False else True
          assert "gh workflow run deploy.yml" in s
          print("News hourly YAML valid: schedule, auth secret, post-push explicit deployment.")
          PY
