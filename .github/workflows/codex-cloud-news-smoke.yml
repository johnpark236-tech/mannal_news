name: Verify cloud Codex hourly news schedule

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-cloud-hourly-news.yml"
      - ".github/workflows/codex-cloud-news-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate YAML and no cached secrets
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import pathlib, yaml
          p=pathlib.Path(".github/workflows/codex-cloud-hourly-news.yml")
          s=p.read_text(encoding="utf-8")
          obj=yaml.safe_load(s)
          on=obj.get("on") or obj.get(True)
          assert "schedule" not in on
          assert "false" in str(obj["jobs"]["publish"]["if"]).lower()
          assert "workflow_dispatch" in on
          assert obj["permissions"]["actions"]=="write"
          assert "CODEX_AUTH_JSON" in s and "secrets.CODEX_AUTH_JSON" in s
          assert "actions/cache" not in s
          assert "cloud_ops.py deploy --kind news --repo work" in s
          assert "Always report actual publishing outcome" in s
          print("News automation paused: no schedule and publisher job disabled.")
          PY
