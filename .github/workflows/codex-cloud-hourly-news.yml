name: Cloud Codex CLI - hourly AI news

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: codex-cloud-hourly-news
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false }} # User requested permanent pause of news writing
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout trusted news repository without write token
        uses: actions/checkout@v4
        with:
          ref: main
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout public Codex orchestration from instructor repository
        uses: actions/checkout@v4
        with:
          repository: johnpark236-tech/ai-instructor-update-log
          ref: main
          path: engine
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: |
          npm install --global @openai/codex@0.164.0
          codex --version

      - name: Prepare Linux workspace-write sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Restore subscription sign-in from GitHub Secret only (no caching)
        shell: bash
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -eu
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::Missing CODEX_AUTH_JSON Actions secret. Add it to this news repository."
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          chmod 700 "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          codex login status

      - name: Codex creates, checks, and independently self-reviews one news article
        run: |
          python -X utf8 engine/automation/codex/hourly_publish.py \
            --kind news --news-repo work --lesson-repo engine --no-push

      - name: Push approved commit and verify matching Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python engine/automation/codex/cloud_ops.py deploy --kind news --repo work

      - name: Always report actual publishing outcome
        if: always()
        run: python engine/automation/codex/cloud_ops.py report --kind news --output ops-report

      - name: Retain sanitized operation result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-publishing-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-report/
          retention-days: 30

      - name: Always remove ephemeral CLI login
        if: always()
        shell: bash
        run: rm -f "$HOME/.codex/auth.json"
