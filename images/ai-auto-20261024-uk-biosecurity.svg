<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#102538"/><g font-family="sans-serif"><text x="65" y="90" fill="#6ee7cf" font-size="24">만날신문 · AI 뉴스 읽기</text><text x="65" y="160" fill="white" font-size="42">영국 AI 생물안보 연구소 발표</text><text x="65" y="210" fill="#d1dce8" font-size="25">연구 목표와 달성한 성과를 구분하세요</text><rect x="65" y="290" width="340" height="205" rx="20" fill="#f2f7fb"/><text x="90" y="345" fill="#137d71" font-size="24">01</text><text x="90" y="395" fill="#102538" font-size="31">발표 확인</text><text x="90" y="445" fill="#3a5063" font-size="23">연구소 설립·지원 약정</text><rect x="430" y="290" width="340" height="205" rx="20" fill="#f2f7fb"/><text x="455" y="345" fill="#137d71" font-size="24">02</text><text x="455" y="395" fill="#102538" font-size="31">목표 구분</text><text x="455" y="445" fill="#3a5063" font-size="23">조기 탐지·대응 연구</text><rect x="795" y="290" width="340" height="205" rx="20" fill="#f2f7fb"/><text x="820" y="345" fill="#137d71" font-size="24">03</text><text x="820" y="395" fill="#102538" font-size="31">근거 점검</text><text x="820" y="445" fill="#3a5063" font-size="23">달성 여부는 별도 확인</text><text x="65" y="560" fill="#6ee7cf" font-size="25">20분 활동: 사실 찾기 → 목표 나누기 → 질문 만들기</text><text x="65" y="625" fill="#c1cedc" font-size="20">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>