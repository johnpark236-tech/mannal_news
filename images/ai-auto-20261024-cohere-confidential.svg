<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AI 처리 중 자료 보호</title><desc id="d">저장, 전송, 처리 중의 세 보호 상태. Model Vault 기밀 컴퓨팅 공개 베타와 사용 권한 별도 확인 안내.</desc><rect width="1200" height="675" fill="#14283d"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="64" y="62" fill="#91ded1" font-size="22">MANNAL DAILY / AI EXPLAINED</text><text x="64" y="126" fill="#fff" font-size="41" font-weight="700">AI가 자료를 처리하는 순간도 보호</text><text x="64" y="176" fill="#cfdeef" font-size="25">Cohere Model Vault · 기밀 컴퓨팅 공개 베타</text><rect x="64" y="231" width="328" height="189" rx="20" fill="#2b425d"/><text x="90" y="280" fill="#91ded1" font-size="24">01 저장 중</text><text x="90" y="334" fill="#fff" font-size="31" font-weight="700">보관하는 자료</text><text x="90" y="380" fill="#cfdeef" font-size="23">디스크에 놓인 상태</text><rect x="436" y="231" width="328" height="189" rx="20" fill="#2b425d"/><text x="462" y="280" fill="#91ded1" font-size="24">02 전송 중</text><text x="462" y="334" fill="#fff" font-size="31" font-weight="700">이동하는 자료</text><text x="462" y="380" fill="#cfdeef" font-size="23">네트워크로 보내는 상태</text><rect x="808" y="231" width="328" height="189" rx="20" fill="#20564f"/><text x="834" y="280" fill="#a5edcf" font-size="24">03 처리 중</text><text x="834" y="334" fill="#fff" font-size="31" font-weight="700">계산하는 자료</text><text x="834" y="380" fill="#cfdeef" font-size="23">AI가 작업하는 상태</text><rect x="64" y="459" width="1072" height="106" rx="18" fill="#31415a"/><text x="90" y="500" fill="#ffdda2" font-size="25" font-weight="700">핵심: 처리 환경 검증 + 요청 내용 암호화</text><text x="90" y="540" fill="#cfdeef" font-size="22">보호 기술이 있어도 자료 사용 권한·조직 정책은 별도 확인</text><text x="64" y="609" fill="#bccdde" font-size="21">발표 2026.10.22 · 출처 Cohere 공식 블로그</text><text x="64" y="645" fill="#bccdde" font-size="20">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>