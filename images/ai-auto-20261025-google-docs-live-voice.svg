<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#102438"/><g font-family="sans-serif"><text x="100" y="135" fill="#74dfc2" font-size="30">AI 뉴스 수업 · Google Docs Live</text><text x="100" y="225" fill="white" font-size="58" font-weight="bold">말한 생각을 문서의 뼈대로</text><text x="100" y="295" fill="#ccd9e8" font-size="30">공식 도움말의 흐름을 읽고, 가상 문서를 설계해 보세요</text><g fill="#203d56"><rect x="100" y="380" width="420" height="230" rx="24"/><rect x="590" y="380" width="420" height="230" rx="24"/><rect x="1080" y="380" width="420" height="230" rx="24"/></g><g fill="#74dfc2" font-size="28"><text x="135" y="435">01 · 요구 설명</text><text x="625" y="435">02 · 계획 확인</text><text x="1115" y="435">03 · 초안 검토</text></g><g fill="white" font-size="34"><text x="135" y="510">목적과 독자 정하기</text><text x="625" y="510">목차부터 고치기</text><text x="1115" y="510">빠진 정보 표시하기</text></g><g fill="#ccd9e8" font-size="26"><text x="135" y="565">어떤 문서가 필요한가?</text><text x="625" y="565">필요한 항목이 있는가?</text><text x="1115" y="565">사실과 초안 대조하기</text></g><text x="100" y="710" fill="#f8d28a" font-size="30">현재 영어 · 모바일 · 적격 요금제 필요 / 한국 제공 여부 별도 확인</text><text x="100" y="815" fill="#ccd9e8" font-size="27">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>
