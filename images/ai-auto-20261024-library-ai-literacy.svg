<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">도서관에서 배우는 AI 활용과 판단</title><desc id="d">Microsoft와 미국 공공도서관협회의 무료 AI 교육 확대 발표. 아래는 AI 도움, 자료 확인, 사람 판단을 나누는 기자의 수업 제안이다.</desc><rect width="1200" height="675" fill="#14263c"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="64" y="61" fill="#93dfce" font-size="22">MANNAL DAILY / COMMUNITY AI LEARNING</text><text x="64" y="125" fill="#fff" font-size="40" font-weight="700">동네 도서관에서 배우는 AI</text><text x="64" y="172" fill="#cfdef0" font-size="25">Microsoft × 미국 공공도서관협회 · 무료 교육 확대 발표</text><rect x="64" y="211" width="1072" height="93" rx="18" fill="#214657"/><text x="90" y="249" fill="#fff" font-size="25" font-weight="700">도구 사용법 + 개인정보 보호 + 근거를 살피는 판단력</text><text x="90" y="284" fill="#cfdef0" font-size="21">미국 중심 계획 / 한국어 강좌·국내 신청 가능 여부는 별도 확인</text><text x="64" y="359" fill="#ffdda2" font-size="24">기자의 20분 수업 제안: 내 일의 AI 사용 기준 세우기</text><rect x="64" y="389" width="328" height="143" rx="18" fill="#2d425e"/><text x="90" y="436" fill="#fff" font-size="29" font-weight="700">AI가 도울 부분</text><text x="90" y="483" fill="#cfdef0" font-size="23">초안·요약의 범위 정하기</text><rect x="436" y="389" width="328" height="143" rx="18" fill="#28534e"/><text x="462" y="436" fill="#fff" font-size="29" font-weight="700">자료·권한 확인</text><text x="462" y="483" fill="#cfdef0" font-size="23">입력 전 조건 살펴보기</text><rect x="808" y="389" width="328" height="143" rx="18" fill="#4a3c58"/><text x="834" y="436" fill="#fff" font-size="29" font-weight="700">사람의 판단</text><text x="834" y="483" fill="#cfdef0" font-size="23">검토·최종 결정 남기기</text><text x="64" y="597" fill="#bdcde1" font-size="21">발표 2026.10.22 · 출처 Microsoft 공식 블로그</text><text x="64" y="640" fill="#bdcde1" font-size="20">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>