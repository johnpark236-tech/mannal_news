<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AI 연구 협력과 답변 점검 수업</title><desc id="d">공식 발표는 OpenAI와 NASK의 AI 평가 및 보호장치 연구 협력이다. 수업 제안은 주장, 근거, 확인할 일을 나누는 활동이다.</desc><rect width="1200" height="675" fill="#12243b"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="64" y="59" fill="#8edbd2" font-size="21">MANNAL DAILY / AI LITERACY</text><text x="64" y="119" fill="#fff" font-size="39" font-weight="700">OpenAI × NASK, AI 안전 연구 협력</text><text x="64" y="163" fill="#cadaed" font-size="24">2026.10.23 공식 발표 · 새 소비자 기능 출시가 아님</text><rect x="64" y="201" width="1072" height="155" rx="20" fill="#204459"/><text x="90" y="243" fill="#8edbd2" font-size="23">공식 발표 / 공동 연구 방향</text><text x="90" y="295" fill="#fff" font-size="30" font-weight="700">AI 시스템 평가 · 취약점 확인 · 보호장치 강화</text><text x="90" y="331" fill="#cadaed" font-size="21">협약 체결은 연구 결과나 안전성 인증을 뜻하지 않음</text><text x="64" y="405" fill="#ffdc9d" font-size="24">기자의 20분 수업 제안 / 답변에 확인 표시 붙이기</text><rect x="64" y="433" width="326" height="103" rx="16" fill="#30405d"/><text x="90" y="475" fill="#fff" font-size="28" font-weight="700">01 주장</text><text x="90" y="512" fill="#cadaed" font-size="22">무엇을 말하고 있나요?</text><rect x="435" y="433" width="326" height="103" rx="16" fill="#28514f"/><text x="461" y="475" fill="#fff" font-size="28" font-weight="700">02 근거</text><text x="461" y="512" fill="#cadaed" font-size="22">어느 자료에 있나요?</text><rect x="806" y="433" width="330" height="103" rx="16" fill="#4b3d57"/><text x="832" y="475" fill="#fff" font-size="28" font-weight="700">03 확인할 일</text><text x="832" y="512" fill="#cadaed" font-size="22">아직 모르는 것은?</text><text x="64" y="595" fill="#b9cade" font-size="21">출처 OpenAI 공식 공지 · 수업 활동은 기자의 독립적인 교육 제안</text><text x="64" y="636" fill="#b9cade" font-size="20">만날신문 편집 그래픽 · 실제 제품 화면 아님</text></g></svg>